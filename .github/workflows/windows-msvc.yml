name: MiniHTML Windows MSVC build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MiniHTML.cpp'
      - '.github/workflows/windows-msvc.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build x64 with Visual Studio 2022 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC x64 environment and compile
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /utf-8 /O2 /DUNICODE /D_UNICODE MiniHTML.cpp /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comctl32.lib winhttp.lib shlwapi.lib gdiplus.lib /OUT:MiniHTML.exe
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path .\MiniHTML.exe)) { throw 'MiniHTML.exe was not produced.' }
          Get-Item .\MiniHTML.exe | Format-List Name,Length,LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MiniHTML-Windows-x64
          path: MiniHTML.exe
          if-no-files-found: error
          retention-days: 7
